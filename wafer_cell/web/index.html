<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R22 공정 모니터</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div id="app">

  <header class="tb">
    <h1 id="cellname">웨이퍼 검사셀</h1>
    <span class="srcbadge" id="src-badge" title="시뮬레이션 - 실제 장비 아님 · 사이클은 가정 속도 기준">시뮬레이션</span>
    <span class="linkbadge" id="link-badge" hidden>-</span>
    <b id="st-state">-</b>
    <span class="sp"></span>
    <div class="ctl" id="controls">
      <button data-cmd="home" class="b">원점 복귀</button>
      <button data-cmd="start" class="b">시작</button>
      <button data-cmd="resume" class="b">재개</button>
      <button data-cmd="pause" class="b">일시정지</button>
      <button data-cmd="op_ng" class="b">불량 카세트 교체</button>
      <button data-cmd="reset" class="b">알람 해제</button>
      <button data-cmd="stop" class="b stop" title="소프트 정지 - E-STOP 아님">소프트 정지</button>
    </div>
    <span class="viewonly" id="viewonly" hidden>보기 전용</span>
    <a class="tool" id="btn-3d" href="/3d.html" target="_blank" rel="noopener" title="3D 보기 (새 창, 보기 전용)">3D</a>
    <button class="tool" id="btn-tools">도구 ▾</button>
    <button class="tool" id="btn-detail" title="축 · 센서 · 수치 (D)">상세</button>
  </header>

  <section class="flow" aria-label="공정 흐름">
    <ol class="stages" id="stages"></ol>
    <div class="head"><span id="headline"></span><span class="sub det" id="subline"></span></div>
    <div class="timeline" id="timeline" aria-label="공정 단계"></div>
    <div class="alarmbar" id="alarmbar" hidden></div>
  </section>

  <main class="grid">
    <section class="panel p-plan">
      <svg id="plan" viewBox="-370 -400 1180 792" preserveAspectRatio="xMidYMid meet" aria-label="셀 평면도"></svg>
    </section>

    <section class="panel p-elev">
      <svg id="elev" viewBox="-78 -440 430 384" preserveAspectRatio="xMidYMid meet" aria-label="포크 방향 단면"></svg>
    </section>

    <section class="panel p-bot">
      <div class="cam-box">
        <img id="cam-img" alt="검사 카메라 영상" hidden>
        <svg id="cam-sim" viewBox="-120 -292 240 120" preserveAspectRatio="xMidYMid meet" aria-label="검사 카메라 개념도"></svg>
        <span class="badge" id="cam-badge">-</span>
        <span class="judge" id="judge" hidden>-</span>
      </div>
      <div class="hero">
        <span class="lbl">검사</span>
        <b id="st-done">0</b>
        <span class="okng" id="st-okng">-</span>
      </div>
      <div class="cassettes" id="cassettes"></div>
    </section>

    <aside class="side det">
      <section class="panel p-info">
        <div class="cline" id="cnt-line">-</div>
        <div class="cline" id="judge-line">-</div>
        <div class="cline">사이클 (가정 속도) <b id="st-cycle">-</b> · <span class="pill warn" id="assumed">가정</span></div>
        <div class="cline" id="sharp-line" title="Z 거리 = 349.1 - ZC · R 거리 = 104 + RX (R22 문서)">-</div>
        <div class="cline warnline" id="uv-line" hidden>-</div>
        <div class="cline wrap" id="link-line" hidden>-</div>
      </section>
      <section class="panel p-axes">
        <div class="ph"><h2>축 (지령값 · 점선 = Sharp)</h2><span class="sp"></span><span class="badge warn" id="homed-badge" hidden>원점 미확정</span></div>
        <div class="axes" id="axes"></div>
      </section>
      <section class="panel p-sens">
        <div class="ph"><h2>센서</h2><span class="sp"></span><span class="pill" id="ilock">-</span></div>
        <div class="chips" id="chips"></div>
      </section>
    </aside>
  </main>

  <div class="pop" id="pop-tools" hidden>
    <div class="simonly">
      <h3>시뮬 전용</h3>
      <div class="row">
        <div class="seg" id="speed">
          <button data-speed="1">×1</button><button data-speed="5">×5</button><button data-speed="10">×10</button><button data-speed="20">×20</button>
        </div>
        <button class="b" id="btn-auto" title="③ 가득 찼을 때 작업자가 자동으로 카세트를 바꿈">작업자 자동</button>
      </div>
      <div class="row">
        <button class="b" id="btn-load">카세트 웨이퍼 맵</button>
        <button class="b" id="btn-cart">대차 맵</button>
        <button class="b" id="btn-fault">고장 주입</button>
        <button class="b estop" id="btn-estop" data-cmd="estop" title="시뮬 E-STOP (실제 장비의 하드웨어 E-STOP 이 아님)">E-STOP 시뮬</button>
      </div>
    </div>
    <div class="row">
      <button class="b" id="btn-ngnext" title="PC 판정: 다음 웨이퍼를 NG 로 (판정 알고리즘 미구현)">다음 웨이퍼 NG</button>
      <button class="b" id="btn-theme">밝은/어두운 화면</button>
      <button class="b" id="btn-log">이벤트 로그</button>
    </div>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="dh"><h2>이벤트 로그</h2><span class="sp"></span><button class="b" id="btn-log-close">닫기</button></div>
    <div class="caps" id="caps" hidden></div>
    <ol class="log" id="log"></ol>
  </div>

  <div class="pop" id="pop-load" hidden>
    <h3>다음 대차 카세트의 웨이퍼 (위 = 슬롯 5)</h3>
    <div class="loadgrid" id="loadgrid"></div>
    <div class="row"><button class="b" data-fill="5">5장</button><button class="b" data-fill="3">3장</button><button class="b" data-fill="gap">빈칸 섞기</button><span class="sp"></span><button class="b go" id="load-apply">적용</button></div>
  </div>
  <div class="pop" id="pop-cart" hidden>
    <h3>다음 대차의 카세트 자리</h3>
    <div class="loadgrid" id="cartgrid"></div>
    <div class="row"><span class="sp"></span><button class="b go" id="cart-apply">적용</button></div>
  </div>
  <div class="pop" id="pop-fault" hidden>
    <h3>고장 주입</h3>
    <div class="faults" id="faults"></div>
  </div>

  <div class="modal-bg" id="modal" hidden><div class="modal" id="modal-body"></div></div>
  <div class="stale" id="stale" hidden><div><b>데이터 정지</b><span id="stale-why">서버 연결 확인 중…</span></div></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script>window.BOOT = /*__BOOT__*/null;</script>
<script src="app.js"></script>
</body>
</html>
